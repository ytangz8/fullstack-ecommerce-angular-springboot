server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:h2:mem:catalogdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  data:
    rest:
      base-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
