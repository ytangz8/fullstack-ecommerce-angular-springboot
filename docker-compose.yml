# Phase 1 of the microservices migration (see ARCHITECTURE.md).
# chat-service is extracted from the monolith and receives /api/chat/** traffic.
# All other /api/** requests are still reverse-proxied to the monolith.

services:
  monolith:
    build:
      context: ./backend
    image: ecommerce/monolith:dev
    container_name: ecommerce-monolith
    expose:
      - "8443"
    # The monolith's existing CORS config (allowed.origins=https://localhost:4200)
    # still applies — the browser's Origin header is preserved end-to-end.
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://localhost:8443/api/products"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  chat-service:
    build:
      context: ./services/chat-service
    image: ecommerce/chat-service:dev
    container_name: ecommerce-chat
    expose:
      - "8085"
    environment:
      SERVER_PORT: "8085"
      # Ollama runs on the host machine; host.docker.internal resolves correctly
      # on Docker Desktop (Mac/Windows). The extra_hosts entry below makes it
      # work on Linux too.
      OLLAMA_URI: http://host.docker.internal:11434
      OLLAMA_MODEL: "llava:7b"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  api-gateway:
    build:
      context: ./services/api-gateway
    image: ecommerce/api-gateway:dev
    container_name: ecommerce-gateway
    ports:
      - "8443:8443"
    environment:
      SERVER_PORT: "8443"
      MONOLITH_URI: https://monolith:8443
      CHAT_SERVICE_URI: http://chat-service:8085
    depends_on:
      monolith:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
